roles:
  literature:
    mounts: { read: [lit/, logic/], write: [lit/] }
    network: []   # scholarly APIs are reached only through the host-side literature.* tools
    executor_tools: [literature.search, literature.fetch, literature.resolve, literature.expand]
  coder:
    mounts: { read: [src/, logic/experiments.md], write: [src/, experiments/] }
    network: [pypi.org, files.pythonhosted.org, registry.npmjs.org]
    executor_tools: [jobs.submit, jobs.status]
  analysis:
    mounts: { read: [evidence/, logic/], write: [analysis/, staging/claims/] }   # drafts for the claim gate
    network: []
    executor_tools: [jobs.fetch_results]
  panel:
    mounts: { read: [engine/panels/<id>/packet/], write: [engine/panels/<id>/responses/<member>/] }
    network: []
    executor_tools: []
  writer:
    mounts: { read: [logic/, evidence/, drafts/], write: [drafts/] }
    network: []
    executor_tools: []
  orchestrator:   # research sessions (DR-0014): host-side and read-only over the committed project; never a container
    mounts: { read: [PAPER.md, logic/, trace/, evidence/tables/, analysis/, lit/notes/, engine/claims/, engine/jobs/], write: [] }
    network: []
    executor_tools: []
defaults: { secrets: none, egress: deny }
